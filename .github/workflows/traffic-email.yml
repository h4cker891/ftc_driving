name: GitHub Traffic Alert

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-traffic:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Check traffic
        id: traffic
        env:
          GH_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: |
          curl -s \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/h4cker891/ftc_driving/traffic/views?per=day" \
            > traffic.json

          TODAY=$(python3 -c "
          import json
          with open('traffic.json') as f:
              data=json.load(f)
          print(data['views'][0]['count'] if data.get('views') else 0)
          ")

          echo "views=$TODAY" >> "$GITHUB_OUTPUT"

          if [ -f traffic-state.txt ]; then
            LAST=$(cat traffic-state.txt)
          else
            LAST=0
          fi

          echo "Previous views: $LAST"
          echo "Current views: $TODAY"

          if [ "$TODAY" -gt "$LAST" ]; then
            echo "new_views=true" >> "$GITHUB_OUTPUT"
          else
            echo "new_views=false" >> "$GITHUB_OUTPUT"
          fi

          echo "$TODAY" > traffic-state.txt

      - name: Send email
        if: steps.traffic.outputs.new_views == 'true'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          curl -X POST "https://api.resend.com/emails" \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{
              "from": "onboarding@resend.dev",
              "to": ["lucasfielding3@gmail.com"],
              "subject": "👀 New GitHub repo visit",
              "html": "<h2>New visitor detected 👀</h2><p>Your <b>ftc_driving</b> repository has new recorded traffic.</p><p>Views today: '${{ steps.traffic.outputs.views }}'</p>"
            }'

      - name: Save traffic count
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add traffic-state.txt
          git diff --cached --quiet || git commit -m "Update traffic state"
          git push
